RSJ/9k=","original":"ccna-1-v7-modules-11-13-ip-addressing-exam-answers-full.jpg","alt":"Ilustracja do zadania 49"}],"pl":{"prompt":"Otwórz ćwiczenie Packet Tracer. Wykonaj zadania opisane w instrukcji, a następnie odpowiedz na pytanie.\n\nKtóre trzy adresy IPv6 są wyświetlane podczas śledzenia trasy z PC1 do PC2? Wybierz trzy odpowiedzi.","options":["2001:DB8:1:1::1","2001:DB8:1:1::A","2001:DB8:1:2::2","2001:DB8:1:2::1","2001:DB8:1:3::1","2001:DB8:1:3::2","2001:DB8:1:4::1"],"explanation":"Polecenie ipv6config na PC2 pokazuje adres 2001:DB8:1:4::A. Adres link-local FE80::260:70FF:FE34:6930 nie jest używany do śledzenia tej trasy. Polecenie tracert 2001:DB8:1:4::A na PC1 wyświetla cztery adresy: 2001:DB8:1:1::1, 2001:DB8:1:2::1, 2001:DB8:1:3::2 oraz 2001:DB8:1:4::A."}},{"id":"q50","number":50,"prompt":"A host is transmitting a broadcast. Which host or hosts will receive it?","type":"single","options":[{"id":"a0","text":"all hosts in the same subnet"},{"id":"a1","text":"a specially defined group of hosts"},{"id":"a2","text":"the closest neighbor on the same network"},{"id":"a3","text":"all hosts on the Internet"}],"correct":["a0"],"explanation":"A broadcast is delivered to every host that has an IP address within the same network.","images":[],"pl":{"prompt":"Host wysyła transmisję broadcast. Które hosty ją otrzymają?","options":["wszystkie hosty w tej samej podsieci","specjalnie zdefiniowana grupa hostów","najbliższy sąsiad w tej samej sieci","wszystkie hosty w Internecie"],"explanation":"Transmisja broadcast dociera do każdego hosta mającego adres IP w tej samej sieci."}},{"id":"q51","number":51,"prompt":"A host is transmitting a unicast. Which host or hosts will receive it?","type":"single","options":[{"id":"a0","text":"one specific host"},{"id":"a1","text":"a specially defined group of hosts"},{"id":"a2","text":"all hosts on the Internet"},{"id":"a3","text":"the closest neighbor on the same network"}],"correct":["a0"],"explanation":"A unicast transmission is a one-to-one communication method where data is sent from a single source host to one specific destination IP address. Unlike a broadcast (which targets all hosts within the subnet) or a multicast (which targets a specifically defined group), a unicast packet is uniquely destined for one individual device on the network.","images":[],"pl":{"prompt":"Host wysyła transmisję unicast. Który host lub które hosty ją otrzymają?","options":["jeden konkretny host","specjalnie zdefiniowana grupa hostów","wszystkie hosty w Internecie","najbliższy sąsiad w tej samej sieci"],"explanation":"Unicast to komunikacja jeden do jednego: dane są wysyłane z jednego hosta źródłowego na jeden konkretny adres docelowy. Broadcast obejmuje wszystkie hosty w podsieci, a multicast określoną grupę. Pakiet unicast jest przeznaczony dla pojedynczego urządzenia."}},{"id":"q52","number":52,"prompt":"A user issues a ping 2001:db8:FACE:39::10 command and receives a response that includes a code of 3. What does this code represent?","type":"single","options":[{"id":"a0","text":"address unreachable"},{"id":"a1","text":"network unreachable"},{"id":"a2","text":"host unreachable"},{"id":"a3","text":"protocol unreachable"}],"correct":["a0"],"explanation":"Within ICMPv6, Type 1 error messages indicate that the \"Destination is Unreachable\". The specific Code field inside this message diagnoses the exact cause of the failure:\n\nCode 0: No route to destination (the router lacks a path to that network).\nCode 1: Communication with destination administratively prohibited (e.g., blocked by a firewall rule or ACL).\nCode 2: Beyond scope of the source address.\nCode 3: Address unreachable. This implies that the packet successfully reached the local gateway or edge router serving the destination segment, but that router failed to map or resolve the Layer 2 physical address (Neighbor Discovery/NDP failure) required to deliver the packet to the final host.","images":[],"pl":{"prompt":"Użytkownik wykonuje polecenie ping 2001:db8:FACE:39::10 i otrzymuje odpowiedź zawierającą kod 3. Co oznacza ten kod?","options":["adres nieosiągalny","sieć nieosiągalna","host nieosiągalny","protokół nieosiągalny"],"explanation":"W ICMPv6 komunikaty błędu typu 1 oznaczają nieosiągalny cel. Pole Code określa przyczynę:\nKod 0: brak trasy do celu.\nKod 1: komunikacja z celem administracyjnie zabroniona, np. przez zaporę lub ACL.\nKod 2: cel poza zakresem adresu źródłowego.\nKod 3: adres nieosiągalny. Pakiet dotarł do routera obsługującego segment docelowy, ale router nie ustalił adresu fizycznego warstwy 2 potrzebnego do dostarczenia pakietu hostowi, np. wskutek niepowodzenia NDP."}},{"id":"q53","number":53,"prompt":"A host is transmitting a multicast. Which host or hosts will receive it?","type":"single","options":[{"id":"a0","text":"a specially defined group of hosts"},{"id":"a1","text":"the closest neighbor on the same network"},{"id":"a2","text":"one specific host"},{"id":"a3","text":"directly connected network devices"}],"correct":["a0"],"explanation":"A multicast transmission is designed to send data packets from a single source to a specific group of destination hosts that have explicitly joined or subscribed to a multicast group address (such as devices listening to routing protocols or video streams). Unlike a broadcast (which delivers data to every single host on the subnet) or a unicast (which targets one specific device), multicast optimizes network bandwidth by duplicating and delivering traffic only to the interested group members.","images":[],"pl":{"prompt":"Host wysyła transmisję multicast. Które hosty ją otrzymają?","options":["specjalnie zdefiniowana grupa hostów","najbliższy sąsiad w tej samej sieci","jeden konkretny host","bezpośrednio podłączone urządzenia sieciowe"],"explanation":"Multicast wysyła pakiety z jednego źródła do określonej grupy hostów, które dołączyły do danego adresu grupowego, np. odbiorców strumienia wideo. Broadcast obejmuje wszystkie hosty w podsieci, a unicast pojedyncze urządzenie. Multicast oszczędza przepustowość, dostarczając ruch tylko zainteresowanym członkom grupy."}},{"id":"q60","number":60,"prompt":"Which is the compressed format of the IPv6 address 2001:0db8:0000:0000:0000:a0b0:0008:0001?","type":"single","options":[{"id":"a0","text":"2001:db8::a0b0:8:1"},{"id":"a1","text":"2001:db8::ab8:1:0:1000"},{"id":"a2","text":"2001:db80:0:1::80:1"},{"id":"a3","text":"2001:db80:::1::80:1"}],"correct":["a0"],"explanation":"","images":[],"pl":{"prompt":"Który zapis jest skróconą postacią adresu IPv6 2001:0db8:0000:0000:0000:a0b0:0008:0001?","options":["2001:db8::a0b0:8:1","2001:db8::ab8:1:0:1000","2001:db80:0:1::80:1","2001:db80:::1::80:1"],"explanation":""}},{"id":"q61","number":61,"prompt":"Which is the compressed format of the IPv6 address fe80:09ea:0000:2200:0000:0000:0fe0:0290?","type":"single","options":[{"id":"a0","text":"fe80:9ea:0:2200::fe0:290"},{"id":"a1","text":"fe80:9:20::b000:290"},{"id":"a2","text":"fe80:9ea0::2020:0:bf:e0:9290"},{"id":"a3","text":"fe80:9ea0::2020::bf:e0:9290"}],"correct":["a0"],"explanation":"Omit leading zeros: Remove any starting zeros from each 16-bit segment (hextet). Following this, 09ea becomes 9ea, 0000 becomes 0, 0fe0 simplifies to fe0, and 0290 reduces to 290. (Note: Trailing zeros, such as those in 2200, cannot be dropped).\nCompress with double colons (::): This rule allows you to replace the longest contiguous string of all-zero hextets with a single ::. This specific address features a single 0000 in the third hextet and a consecutive pair of 0000:0000 in the fifth and sixth hextets. You must choose the longest sequence to compress, which substitutes the consecutive pair with ::.\n\nCombining these rules yields the correct optimized format: fe80:9ea:0:2200::fe0:290.","images":[],"pl":{"prompt":"Który zapis jest skróconą postacią adresu IPv6 fe80:09ea:0000:2200:0000:0000:0fe0:0290?","options":["fe80:9ea:0:2200::fe0:290","fe80:9:20::b000:290","fe80:9ea0::2020:0:bf:e0:9290","fe80:9ea0::2020::bf:e0:9290"],"explanation":"Usuń zera wiodące w hekstetach: 09ea → 9ea, 0000 → 0, 0fe0 → fe0, 0290 → 290. Zer końcowych, np. w 2200, nie wolno usuwać.\nPodwójny dwukropek (::) zastępuje najdłuższy spójny ciąg hekstetów złożonych z samych zer. W tym adresie trzecim hekstetem jest pojedyncze 0000, a piąty i szósty tworzą parę 0000:0000. Skracamy dłuższy ciąg, czyli tę parę.\nPoprawny skrócony zapis: fe80:9ea:0:2200::fe0:290."}},{"id":"q62","number":62,"prompt":"Which is the compressed format of the IPv6 address 2002:0042:0010:c400:0000:0000:0000:0909?","type":"single","options":[{"id":"a0","text":"2002:42:10:c400::909"},{"id":"a1","text":"200:420:110:c4b::910:0:90"},{"id":"a2","text":"2002:4200::25:1090:0:99"},{"id":"a3","text":"2002:42::25:1090:0:99"}],"correct":["a0"],"explanation":"Omit leading zeros: Drop any starting zeros within each 16-bit segment (hextet). Following this step, 0042 simplifies to 42, 0010 becomes 10, and 0909 reduces to 909. Trailing zeros (such as the ones in c400) must be kept exactly as they are.\nCompress with the double colon (::): The contiguous string of three consecutive all-zero segments (0000:0000:0000) is fully replaced by a single :: notation.\n\nCombining both optimization rules yields the correct compressed format: 2002:42:10:c400::909.","images":[],"pl":{"prompt":"Który zapis jest skróconą postacią adresu IPv6 2002:0042:0010:c400:0000:0000:0000:0909?","options":["2002:42:10:c400::909","200:420:110:c4b::910:0:90","2002:4200::25:1090:0:99","2002:42::25:1090:0:99"],"explanation":"Usuń zera wiodące w hekstetach: 0042 → 42, 0010 → 10, 0909 → 909. Zera końcowe, np. w c400, pozostają bez zmian.\nTrzy kolejne hekstety 0000:0000:0000 zastąp pojedynczym zapisem ::.\nPoprawna skrócona postać: 2002:42:10:c400::909."}},{"id":"q63","number":63,"prompt":"Which is the compressed format of the IPv6 address 2001:0db8:0000:0000:0ab8:0001:0000:1000?","type":"single","options":[{"id":"a0","text":"2001:db8::ab8:1:0:1000"},{"id":"a1","text":"2001:db8::a0b0:8:1"},{"id":"a2","text":"2001:db8:1::ab8:0:1"},{"id":"a3","text":"2001:db8:0:1::8:1"}],"correct":["a0"],"explanation":"Omit leading zeros: Drop any starting zeros within each 16-bit segment (hextet). Following this step, 0db8 simplifies to db8, 0ab8 becomes ab8, 0001 reduces to 1, and 0000 segments simplify to a single 0. (Note: Trailing zeros, such as the ones in 1000, cannot be omitted).\nCompress with the double colon (::): Replace the longest continuous string of all-zero hextets with a single :: notation. This address contains two all-zero sequences: a two-block sequence (0000:0000) in the 3rd and 4th segments, and a single block (0000) in the 7th segment. Compressing the longest sequence turns the two consecutive blocks into ::, while the 7th segment remains represented by a single 0.\n\nCombining both optimization rules yields the correct compressed format: 2001:db8::ab8:1:0:1000.","images":[],"pl":{"prompt":"Który zapis jest skróconą postacią adresu IPv6 2001:0db8:0000:0000:0ab8:0001:0000:1000?","options":["2001:db8::ab8:1:0:1000","2001:db8::a0b0:8:1","2001:db8:1::ab8:0:1","2001:db8:0:1::8:1"],"explanation":"Usuń zera wiodące: 0db8 → db8, 0ab8 → ab8, 0001 → 1, 0000 → 0. Zer końcowych, np. w 1000, nie usuwamy.\nPodwójny dwukropek (::) zastępuje najdłuższy spójny ciąg zerowych hekstetów. Skracamy hekstety trzeci i czwarty (0000:0000), a pojedynczy zerowy hekstet siódmy zapisujemy jako 0.\nWynik: 2001:db8::ab8:1:0:1000."}},{"id":"q64","number":64,"prompt":"Which is the compressed format of the IPv6 address 2002:0420:00c4:1008:0025:0190:0000:0990?","type":"single","options":[{"id":"a0","text":"2002:420:c4:1008:25:190::990"},{"id":"a1","text":"2002:42:10:c400::909"},{"id":"a2","text":"2002:4200::25:1090:0:99"},{"id":"a3","text":"2002:42::25:1090:0:99"}],"correct":["a0"],"explanation":"To compress an IPv6 address, two standard rules must be followed:\n\nOmit leading zeros in any 16-bit section (hextet). Following this rule: 0420 becomes 420, 00c4 becomes c4, 0025 becomes 25, 0190 becomes 190, and 0990 becomes 990. Trailing zeros must not be dropped.\nUse a double colon (::) to replace any single, contiguous string of one or more segments consisting entirely of zeros. In this address, the seventh hextet is 0000, which is compressed into ::.\n\nCombining these rules, the original address successfully compresses to 2002:420:c4:1008:25:190::990.","images":[],"pl":{"prompt":"Który zapis jest skróconą postacią adresu IPv6 2002:0420:00c4:1008:0025:0190:0000:0990?","options":["2002:420:c4:1008:25:190::990","2002:42:10:c400::909","2002:4200::25:1090:0:99","2002:42::25:1090:0:99"],"explanation":"Usuń zera wiodące: 0420 → 420, 00c4 → c4, 0025 → 25, 0190 → 190, 0990 → 990. Zera końcowe muszą pozostać.\nZerowy siódmy hekstet 0000 jest zastąpiony przez ::.\nOtrzymujemy: 2002:420:c4:1008:25:190::990."}},{"id":"q65","number":65,"prompt":"Which is the compressed format of the IPv6 address 2001:0db8:0000:0000:0000:a0b0:0008:0001?","type":"single","options":[{"id":"a0","text":"2001:db8::a0b0:8:1"},{"id":"a1","text":"2001:db8:1::ab8:0:1"},{"id":"a2","text":"2001:db8::ab8:1:0:1000"},{"id":"a3","text":"2001:db8:0:1::8:1"}],"correct":["a0"],"explanation":"","images":[],"pl":{"prompt":"Który zapis jest skróconą postacią adresu IPv6 2001:0db8:0000:0000:0000:a0b0:0008:0001?","options":["2001:db8::a0b0:8:1","2001:db8:1::ab8:0:1","2001:db8::ab8:1:0:1000","2001:db8:0:1::8:1"],"explanation":""}},{"id":"q66","number":66,"prompt":"Which is the compressed format of the IPv6 address fe80:0000:0000:0000:0220:0b3f:f0e0:0029?","type":"single","options":[{"id":"a0","text":"fe80::220:b3f:f0e0:29"},{"id":"a1","text":"fe80:9ea:0:2200::fe0:290"},{"id":"a2","text":"fe80:9ea0::2020:0:bf:e0:9290"},{"id":"a3","text":"fe80:9ea0::2020::bf:e0:9290"}],"correct":["a0"],"explanation":"Omit leading zeros: In every hextet, any leading zeros are dropped. Thus, 0220 becomes 220, 0b3f becomes b3f, and 0029 reduces to 29.\nCompress contiguous zeros using the double colon (::): The three consecutive all-zero segments (0000:0000:0000) are replaced with a single :: notation.\n\nCombining these optimization steps results in the correct compressed address: fe80::220:b3f:f0e0:29.","images":[],"pl":{"prompt":"Który zapis jest skróconą postacią adresu IPv6 fe80:0000:0000:0000:0220:0b3f:f0e0:0029?","options":["fe80::220:b3f:f0e0:29","fe80:9ea:0:2200::fe0:290","fe80:9ea0::2020:0:bf:e0:9290","fe80:9ea0::2020::bf:e0:9290"],"explanation":"Usuń zera wiodące: 0220 → 220, 0b3f → b3f, 0029 → 29.\nTrzy kolejne hekstety 0000:0000:0000 zastąp jednym ::.\nPoprawny skrócony adres: fe80::220:b3f:f0e0:29."}},{"id":"q67","number":67,"prompt":"Which is the compressed format of the IPv6 address 2001:0db8:0000:0000:0000:a0b0:0008:0001?","type":"single","options":[{"id":"a0","text":"2001:db8::a0b0:8:1"},{"id":"a1","text":"2001:db8::ab8:1:0:1000"},{"id":"a2","text":"2001:db80:0:1::80:1"},{"id":"a3","text":"2001:db8:0:1::8:1"}],"correct":["a0"],"explanation":"","images":[],"pl":{"prompt":"Który zapis jest skróconą postacią adresu IPv6 2001:0db8:0000:0000:0000:a0b0:0008:0001?","options":["2001:db8::a0b0:8:1","2001:db8::ab8:1:0:1000","2001:db80:0:1::80:1","2001:db8:0:1::8:1"],"explanation":""}},{"id":"q68","number":68,"prompt":"Which is the compressed format of the IPv6 address 2002:0042:0010:c400:0000:0000:0000:0909?","type":"single","options":[{"id":"a0","text":"2002:42:10:c400::909"},{"id":"a1","text":"2002:4200::25:1090:0:99"},{"id":"a2","text":"2002:420:c4:1008:25:190::990"},{"id":"a3","text":"2002:42::25:1090:0:99"}],"correct":["a0"],"explanation":"Omit leading zeros: Drop any starting zeros within each 16-bit segment (hextet). Following this step, 0042 simplifies to 42, 0010 becomes 10, and 0909 reduces to 909. Trailing zeros (such as the ones in c400) must be kept exactly as they are.\nCompress with the double colon (::): The contiguous string of three consecutive all-zero segments (0000:0000:0000) is fully replaced by a single :: notation.\n\nCombining both optimization rules yields the correct compressed format: 2002:42:10:c400::909.","images":[],"pl":{"prompt":"Który zapis jest skróconą postacią adresu IPv6 2002:0042:0010:c400:0000:0000:0000:0909?","options":["2002:42:10:c400::909","2002:4200::25:1090:0:99","2002:420:c4:1008:25:190::990","2002:42::25:1090:0:99"],"explanation":"Usuń zera wiodące w hekstetach: 0042 → 42, 0010 → 10, 0909 → 909. Zera końcowe, np. w c400, pozostają bez zmian.\nTrzy kolejne hekstety 0000:0000:0000 zastąp pojedynczym zapisem ::.\nPoprawna skrócona postać: 2002:42:10:c400::909."}},{"id":"q69","number":69,"prompt":"Which is the compressed format of the IPv6 address fe80:09ea:0000:2200:0000:0000:0fe0:0290?","type":"single","options":[{"id":"a0","text":"fe80:9ea:0:2200::fe0:290"},{"id":"a1","text":"fe80:9ea0::2020:0:bf:e0:9290"},{"id":"a2","text":"fe80::220:b3f:f0e0:29"},{"id":"a3","text":"fe80::0220:0b3f:f0e0:0029"}],"correct":["a0"],"explanation":"Omit leading zeros: Remove any starting zeros from each 16-bit segment (hextet). Following this, 09ea becomes 9ea, 0000 becomes 0, 0fe0 simplifies to fe0, and 0290 reduces to 290. (Note: Trailing zeros, such as those in 2200, cannot be dropped).\nCompress with double colons (::): This rule allows you to replace the longest contiguous string of all-zero hextets with a single ::. This specific address features a single 0000 in the third hextet and a consecutive pair of 0000:0000 in the fifth and sixth hextets. You must choose the longest sequence to compress, which substitutes the consecutive pair with ::.\n\nCombining these rules yields the correct optimized format: fe80:9ea:0:2200::fe0:290.","images":[],"pl":{"prompt":"Który zapis jest skróconą postacią adresu IPv6 fe80:09ea:0000:2200:0000:0000:0fe0:0290?","options":["fe80:9ea:0:2200::fe0:290","fe80:9ea0::2020:0:bf:e0:9290","fe80::220:b3f:f0e0:29","fe80::0220:0b3f:f0e0:0029"],"explanation":"Usuń zera wiodące w hekstetach: 09ea → 9ea, 0000 → 0, 0fe0 → fe0, 0290 → 290. Zer końcowych, np. w 2200, nie wolno usuwać.\nPodwójny dwukropek (::) zastępuje najdłuższy spójny ciąg hekstetów złożonych z samych zer. W tym adresie trzecim hekstetem jest pojedyncze 0000, a piąty i szósty tworzą parę 0000:0000. Skracamy dłuższy ciąg, czyli tę parę.\nPoprawny skrócony zapis: fe80:9ea:0:2200::fe0:290."}},{"id":"q70","number":70,"prompt":"A user issues a ping 2001:db8:FACE:39::10 command and receives a response that includes a code of 2. What does this code represent?","type":"single","options":[{"id":"a0","text":"beyond scope of the source address"},{"id":"a1","text":"communication with the destination administratively prohibited"},{"id":"a2","text":"address unreachable"},{"id":"a3","text":"no route to destination"}],"correct":["a0"],"explanation":"In ICMPv6 \"Destination Unreachable\" messages (Type 1), the Code field specifies the precise diagnostic reason why the packet could not be delivered. The standard ICMPv6 codes are defined as follows:\n\nCode 0: No route to destination.\nCode 1: Communication with destination administratively prohibited.\nCode 2: Beyond scope of the source address. This tells the sender that the scope of its source IP address is too constrained (for example, a Link-Local Address) to successfully communicate with the destination IP address (such as a Global Unicast Address).\nCode 3: Address unreachable.","images":[],"pl":{"prompt":"Użytkownik wykonuje polecenie ping 2001:db8:FACE:39::10 i otrzymuje odpowiedź zawierającą kod 2. Co oznacza ten kod?","options":["cel poza zakresem adresu źródłowego","komunikacja z celem administracyjnie zabroniona","adres nieosiągalny","brak trasy do celu"],"explanation":"W ICMPv6 komunikat Destination Unreachable ma typ 1, a pole Code podaje przyczynę niedostarczenia pakietu:\nKod 0: brak trasy do celu.\nKod 1: komunikacja z celem administracyjnie zabroniona.\nKod 2: cel poza zakresem adresu źródłowego. Zakres adresu źródłowego jest zbyt ograniczony, np. adres link-local jest używany do komunikacji z globalnym adresem unicast.\nKod 3: adres nieosiągalny."}},{"id":"q71","number":71,"prompt":"A user issues a ping 192.135.250.103 command and receives a response that includes a code of 1. What does this code represent?","type":"single","options":[{"id":"a0","text":"host unreachable"},{"id":"a1","text":"beyond scope of the source address"},{"id":"a2","text":"address unreachable"},{"id":"a3","text":"communication with the destination administratively prohibited"}],"correct":["a0"],"explanation":"Within ICMPv4 \"Destination Unreachable\" messages (Type 3), the Code field identifies the precise diagnostic reason for the delivery failure. The standard codes are classified as follows:\n\nCode 0: Network unreachable (the router lacks a valid path to the destination network).\nCode 1: Host unreachable. This indicates that the packet successfully reached the local gateway or edge router responsible for the destination network segment, but the specific target host failed to respond (e.g., the device is powered off, disconnected, or its MAC address cannot be resolved via ARP).\nCode 2: Protocol unreachable.\nCode 3: Port unreachable.","images":[],"pl":{"prompt":"Użytkownik wykonuje polecenie ping 192.135.250.103 i otrzymuje odpowiedź zawierającą kod 1. Co oznacza ten kod?","options":["host nieosiągalny","cel poza zakresem adresu źródłowego","adres nieosiągalny","komunikacja z celem administracyjnie zabroniona"],"explanation":"W ICMPv4 komunikat Destination Unreachable ma typ 3, a pole Code określa powód niedostarczenia pakietu:\nKod 0: sieć nieosiągalna, router nie ma poprawnej trasy do sieci docelowej.\nKod 1: host nieosiągalny. Pakiet dotarł do bramy lub routera obsługującego sieć docelową, ale dany host nie odpowiedział, np. jest wyłączony, odłączony lub nie można ustalić jego adresu MAC przez ARP.\nKod 2: protokół nieosiągalny.\nKod 3: port nieosiągalny."}},{"id":"q72","number":72,"prompt":"A user issues a ping fe80:65ab:dcc1::100 command and receives a response that includes a code of 3. What does this code represent?","type":"single","options":[{"id":"a0","text":"address unreachable"},{"id":"a1","text":"communication with the destination administratively prohibited"},{"id":"a2","text":"beyond scope of the source address"},{"id":"a3","text":"no route to destination"}],"correct":["a0"],"explanation":"Within ICMPv6 \"Destination Unreachable\" messages (Type 1), the Code field values identify the precise reason for the delivery failure. The standard definitions are classified as follows:\n\nCode 0: No route to destination.\nCode 1: Communication with destination administratively prohibited.\nCode 2: Beyond scope of the source address.\nCode 3: Address unreachable (the targeted destination IP cannot be resolved or is physically unavailable on the local link).","images":[],"pl":{"prompt":"Użytkownik wykonuje polecenie ping fe80:65ab:dcc1::100 i otrzymuje odpowiedź zawierającą kod 3. Co oznacza ten kod?","options":["adres nieosiągalny","komunikacja z celem administracyjnie zabroniona","cel poza zakresem adresu źródłowego","brak trasy do celu"],"explanation":"W ICMPv6 pole Code komunikatu Destination Unreachable typu 1 określa przyczynę błędu:\nKod 0: brak trasy do celu.\nKod 1: komunikacja z celem administracyjnie zabroniona.\nKod 2: cel poza zakresem adresu źródłowego.\nKod 3: adres nieosiągalny, np. nie można ustalić adresu docelowego lub host jest fizycznie niedostępny w lokalnym łączu."}},{"id":"q73","number":73,"prompt":"A user issues a ping 10.10.14.67 command and receives a response that includes a code of 0. What does this code represent?","type":"single","options":[{"id":"a0","text":"network unreachable"},{"id":"a1","text":"protocol unreachable"},{"id":"a2","text":"port unreachable"},{"id":"a3","text":"host unreachable"}],"correct":["a0"],"explanation":"Within ICMP \"Destination Unreachable\" messages (Type 3), Code 0 specifically stands for Network unreachable. This indicates that the router does not possess a valid route in its routing table to reach the destination network.","images":[],"pl":{"prompt":"Użytkownik wykonuje polecenie ping 10.10.14.67 i otrzymuje odpowiedź zawierającą kod 0. Co oznacza ten kod?","options":["sieć nieosiągalna","protokół nieosiągalny","port nieosiągalny","host nieosiągalny"],"explanation":"W ICMP komunikat Destination Unreachable ma typ 3. Kod 0 oznacza nieosiągalną sieć: router nie ma w tablicy routingu poprawnej trasy do sieci docelowej."}},{"id":"q74","number":74,"prompt":"A user issues a ping fe80:65ab:dcc1::100 command and receives a response that includes a code of 4. What does this code represent?","type":"single","options":[{"id":"a0","text":"port unreachable"},{"id":"a1","text":"host unreachable"},{"id":"a2","text":"protocol unreachable"},{"id":"a3","text":"network unreachable"}],"correct":["a0"],"explanation":"When a device replies with an ICMPv6 \"Destination Unreachable\" message (Type 1), it includes a specific Code value to explain precisely why the packet could not be delivered. Within the ICMPv6 standard, these codes are classified as follows:\n\nCode 0: No route to destination (Network unreachable).\nCode 1: Communication with destination administratively prohibited.\nCode 3: Address unreachable (Host unreachable).\nCode 4: Port unreachable.\n\nConsequently, a code of 4 fundamentally indicates that the packet successfully reached the destination host, but the transport layer protocol (such as UDP) on that host was unable to find an active application or service listening on the targeted port.","images":[],"pl":{"prompt":"Użytkownik wykonuje polecenie ping fe80:65ab:dcc1::100 i otrzymuje odpowiedź zawierającą kod 4. Co oznacza ten kod?","options":["port nieosiągalny","host nieosiągalny","protokół nieosiągalny","sieć nieosiągalna"],"explanation":"Komunikat ICMPv6 Destination Unreachable typu 1 zawiera kod określający przyczynę błędu:\nKod 0: brak trasy do celu (sieć nieosiągalna).\nKod 1: komunikacja z celem administracyjnie zabroniona.\nKod 3: adres nieosiągalny (host nieosiągalny).\nKod 4: port nieosiągalny.\nKod 4 oznacza, że pakiet dotarł do hosta docelowego, ale protokół warstwy transportowej, np. UDP, nie znalazł aplikacji lub usługi nasłuchującej na wskazanym porcie."}},{"id":"q75","number":75,"prompt":"A user issues a ping 198.133.219.8 command and receives a response that includes a code of 0. What does this code represent?","type":"single","options":[{"id":"a0","text":"network unreachable"},{"id":"a1","text":"protocol unreachable"},{"id":"a2","text":"port unreachable"},{"id":"a3","text":"host unreachable"}],"correct":["a0"],"explanation":"","images":[],"pl":{"prompt":"Użytkownik wykonuje polecenie ping 198.133.219.8 i otrzymuje odpowiedź zawierającą kod 0. Co oznacza ten kod?","options":["sieć nieosiągalna","protokół nieosiągalny","port nieosiągalny","host nieosiągalny"],"explanation":""}},{"id":"q76","number":76,"prompt":"A user issues a ping 2001:db8:3040:114::88 command and receives a response that includes a code of 4. What does this code represent?","type":"single","options":[{"id":"a0","text":"port unreachable"},{"id":"a1","text":"host unreachable"},{"id":"a2","text":"protocol unreachable"},{"id":"a3","text":"network unreachable"}],"correct":["a0"],"explanation":"Much like in IPv4 networking, the ICMPv6 protocol relies on distinct code numbers inside its \"Destination Unreachable\" error messages (Type 1) to provide diagnostic details about delivery failures.\nCode 4 specifically stands for Port unreachable. This means that the IP packet was successfully routed across the network and physically reached the target host. However, once the network layer passed the payload up to the transport layer (TCP or UDP), the receiving operating system could not find any active application or service listening on the specified destination port.","images":[],"pl":{"prompt":"Użytkownik wykonuje polecenie ping 2001:db8:3040:114::88 i otrzymuje odpowiedź zawierającą kod 4. Co oznacza ten kod?","options":["port nieosiągalny","host nieosiągalny","protokół nieosiągalny","sieć nieosiągalna"],"explanation":"ICMPv6 przekazuje szczegóły błędów dostarczenia w polu Code komunikatu Destination Unreachable typu 1.\nKod 4 oznacza nieosiągalny port. Pakiet IP dotarł do hosta docelowego, lecz po przekazaniu danych do warstwy transportowej (TCP lub UDP) system operacyjny nie znalazł aktywnej aplikacji lub usługi nasłuchującej na wskazanym porcie."}},{"id":"q77","number":77,"prompt":"A user issues a ping 2001:db8:FACE:39::10 command and receives a response that includes a code of 2. What does this code represent?","type":"single","options":[{"id":"a0","text":"beyond scope of the source address"},{"id":"a1","text":"host unreachable"},{"id":"a2","text":"protocol unreachable"},{"id":"a3","text":"network unreachable"}],"correct":["a0"],"explanation":"In ICMPv6 \"Destination Unreachable\" messages (Type 1), the Code field specifies the precise diagnostic reason why the packet could not be delivered. The standard ICMPv6 codes are defined as follows:\n\nCode 0: No route to destination.\nCode 1: Communication with destination administratively prohibited.\nCode 2: Beyond scope of the source address. This tells the sender that the scope of its source IP address is too constrained (for example, a Link-Local Address) to successfully communicate with the destination IP address (such as a Global Unicast Address).\nCode 3: Address unreachable.","images":[],"pl":{"prompt":"Użytkownik wykonuje polecenie ping 2001:db8:FACE:39::10 i otrzymuje odpowiedź zawierającą kod 2. Co oznacza ten kod?","options":["cel poza zakresem adresu źródłowego","host nieosiągalny","protokół nieosiągalny","sieć nieosiągalna"],"explanation":"W ICMPv6 komunikat Destination Unreachable ma typ 1, a pole Code podaje przyczynę niedostarczenia pakietu:\nKod 0: brak trasy do celu.\nKod 1: komunikacja z celem administracyjnie zabroniona.\nKod 2: cel poza zakresem adresu źródłowego. Zakres adresu źródłowego jest zbyt ograniczony, np. adres link-local jest używany do komunikacji z globalnym adresem unicast.\nKod 3: adres nieosiągalny."}}]}</script>

let session=null,history=[],view="home",reviewErrorsOnly=true,browseFavoritesOnly=false,browseQuery="",refreshBrowse=null,toastTimer,persistenceWarning=false;
const messages={
pl:{language:"Język quizu",footer:"Jedno pytanie naraz · ocena po odpowiedzi · losowa kolejność w każdej rundzie",source:"Źródło pytań:",topic:"Adresowanie IPv4 · IPv6 · ICMP",heroFirst:"Jedno pytanie.",heroSecond:"Pełne skupienie.",heroText:"Wybierz język, sprawdź odpowiedź i zapisuj gwiazdką pytania do powtórki.",setup:"Twoja runda",chooseScope:"Wybierz zestaw pytań",allScope:"Cała baza",starredScope:"Gwiazdkowane",poolTitle:n=>`Pytania w rundzie: ${n}`,type_single:"Jedna odpowiedź",type_multiple:"Kilka odpowiedzi",type_match:"Dopasowanie",type_text:"Uzupełnienie",scoring:"1 punkt za całe poprawnie rozwiązane zadanie. Przy kilku odpowiedziach trzeba zaznaczyć cały właściwy zestaw.",start:"Rozpocznij quiz →",startNew:"Rozpocznij nową rundę →",resumeEyebrow:"Runda w toku",resumeText:(n,total,scope)=>`${scope} · ocenione: ${n} / ${total}`,resume:"Kontynuuj →",newRoundNote:"Rozpoczęcie nowej rundy zastąpi bieżące odpowiedzi.",savedEyebrow:"Twoje powtórki",savedTitle:"Pytania z gwiazdką",savedCount:n=>`★ ${n}`,savedText:"Gwiazdki są wspólne dla polskiej i angielskiej wersji. Dodawaj je w quizie lub w przeglądzie pytań.",manageStars:"Przeglądaj pytania i gwiazdki",export:"Zapisz kopię z gwiazdkami ↓",offline:"Cała baza i ilustracje są w tym pliku. Quiz działa bez internetu, a postęp i gwiazdki zapisują się w przeglądarce.",lastResult:(n,total,pct,scope)=>`Ostatni wynik: ${n} / ${total} (${pct}%) · ${scope}`,lastResultButton:"Zobacz wynik",noStars:"Dodaj co najmniej jedną gwiazdkę, aby rozpocząć ten quiz.",question:"Pytanie",backHome:"Zapisz i wróć",sourceNumber:n=>`Źródło #${n}`,addStar:"Dodaj gwiazdkę",removeStar:"Usuń gwiazdkę",starred:"Zapisane",chooseOne:"Zaznacz jedną odpowiedź.",chooseMany:n=>`Zaznacz dokładnie ${n} odpowiedzi.`,chooseMatch:"Wybierz odpowiedź dla każdego wiersza.",chooseText:"Wpisz brakującą wartość.",locked:"Odpowiedź sprawdzona.",selectPlaceholder:"Wybierz…",yourAnswer:"Twoja odpowiedź",textPlaceholder:"Wpisz wartość…",correctAnswer:"Poprawna odpowiedź",correctAnswers:"Poprawne odpowiedzi",correctMatches:"Poprawne dopasowania",correct:"Dobra odpowiedź",incorrect:"Błędna odpowiedź",explanation:"Wyjaśnienie",check:"Sprawdź odpowiedź",next:"Dalej →",showResult:"Dalej — wynik →",beforeCheck:"Zatwierdź odpowiedź, aby zobaczyć ocenę.",afterCheck:"Kliknij „Dalej”, aby przejść do następnego pytania.",selectedCount:(n,total)=>`Zaznaczono ${n} / ${total}.`,image:n=>`Ilustracja ${n}`,imageAlt:n=>`Ilustracja do pytania źródłowego ${n}`,imageError:"Nie można wyświetlić ilustracji.",resultEyebrow:"Runda ukończona",perfectTitle:"Cała runda opanowana.",resultTitle:"Twój wynik jest gotowy.",correctShort:"poprawnie",wrongShort:"błędnie",totalShort:"wszystkich pytań",ringLabel:"poprawnych odpowiedzi",resultText:(n,total,time)=>`Wynik: ${n} / ${total} pkt. Czas rundy: około ${time} min.`,retry:"Nowa runda — tasuj pytania ↻",home:"Ekran główny",review:"Sprawdź odpowiedzi",onlyErrors:"Tylko błędne",noErrors:"Nie ma błędnych odpowiedzi. Wyłącz filtr, aby przejrzeć całą rundę.",reviewMeta:(ok,n,source)=>`${ok?"✓ Poprawnie":"× Błędnie"} · w rundzie ${n} · źródło #${source}`,noAnswer:"Brak odpowiedzi",browseEyebrow:"Baza pytań",browseTitle:"Wybierz, co powtórzysz.",browseText:"Kliknij gwiazdkę przy pytaniu. Ten sam zestaw możesz ćwiczyć w obu językach.",back:"← Ekran główny",searchLabel:"Szukaj pytania lub adresu IP",searchPlaceholder:"Wpisz fragment pytania, numer lub adres…",onlyStarred:"Tylko gwiazdkowane",browseCount:(shown,total,saved)=>`Widoczne: ${shown} / ${total} · z gwiazdką: ${saved}`,startStarred:"Quiz z gwiazdek →",noMatches:"Brak pytań pasujących do wyszukiwania.",emptyStars:"Nie masz jeszcze pytań z gwiazdką. Pokaż całą bazę i wybierz pytania do powtórki.",showAll:"Pokaż całą bazę",headerStars:"Pokaż pytania z gwiazdką",saveFailure:"Nie udało się zapisać postępu w przeglądarce. Zostaw tę kartę otwartą; gwiazdki możesz zachować przyciskiem zapisu kopii.",exportDone:"Zapisano kopię quizu z Twoimi gwiazdkami i wybranym językiem.",noBank:"Nie udało się odczytać bazy pytań."},
en:{language:"Quiz language",footer:"One question at a time · feedback after each answer · shuffled every round",source:"Question source:",topic:"IPv4 addressing · IPv6 · ICMP",heroFirst:"One question.",heroSecond:"Full focus.",heroText:"Choose your language, check each answer and star the questions you want to practise.",setup:"Your round",chooseScope:"Choose your question set",allScope:"Full question bank",starredScope:"Starred questions",poolTitle:n=>`Questions in this round: ${n}`,type_single:"Single answer",type_multiple:"Multiple answers",type_match:"Matching",type_text:"Fill in the blank",scoring:"1 point for a completely correct question. For multiple answers, select the entire correct set.",start:"Start quiz →",startNew:"Start a new round →",resumeEyebrow:"Round in progress",resumeText:(n,total,scope)=>`${scope} · answered: ${n} / ${total}`,resume:"Continue →",newRoundNote:"Starting a new round replaces your current answers.",savedEyebrow:"Your revision",savedTitle:"Questions you've starred",savedCount:n=>`★ ${n}`,savedText:"Stars are shared between Polish and English. Add them during a quiz or while browsing the question bank.",manageStars:"Browse questions and stars",export:"Save a copy with your stars ↓",offline:"The question bank and illustrations are included in this file. The quiz works offline; progress and stars are saved in your browser.",lastResult:(n,total,pct,scope)=>`Last result: ${n} / ${total} (${pct}%) · ${scope}`,lastResultButton:"View result",noStars:"Star at least one question to start this quiz.",question:"Question",backHome:"Save and return",sourceNumber:n=>`Source #${n}`,addStar:"Add star",removeStar:"Remove star",starred:"Starred",chooseOne:"Select one answer.",chooseMany:n=>`Select exactly ${n} answers.`,chooseMatch:"Choose an answer for every row.",chooseText:"Enter the missing value.",locked:"Answer checked.",selectPlaceholder:"Choose…",yourAnswer:"Your answer",textPlaceholder:"Enter a value…",correctAnswer:"Correct answer",correctAnswers:"Correct answers",correctMatches:"Correct matches",correct:"Correct answer",incorrect:"Incorrect answer",explanation:"Explanation",check:"Check answer",next:"Next →",showResult:"Next — results →",beforeCheck:"Submit your answer to see the feedback.",afterCheck:"Click Next to go to the next question.",selectedCount:(n,total)=>`Selected ${n} / ${total}.`,image:n=>`Exhibit ${n}`,imageAlt:n=>`Exhibit for source question ${n}`,imageError:"The exhibit could not be displayed.",resultEyebrow:"Round completed",perfectTitle:"Every question correct.",resultTitle:"Your results are ready.",correctShort:"correct",wrongShort:"incorrect",totalShort:"questions total",ringLabel:"correct answers",resultText:(n,total,time)=>`Score: ${n} / ${total}. Round time: about ${time} min.`,retry:"New round — shuffle questions ↻",home:"Home",review:"Review your answers",onlyErrors:"Incorrect only",noErrors:"No incorrect answers. Turn off the filter to review the full round.",reviewMeta:(ok,n,source)=>`${ok?"✓ Correct":"× Incorrect"} · round question ${n} · source #${source}`,noAnswer:"No answer",browseEyebrow:"Question bank",browseTitle:"Choose what to practise.",browseText:"Star any question. Practise the same saved set in either language.",back:"← Home",searchLabel:"Search questions or IP addresses",searchPlaceholder:"Enter part of a question, its number or an address…",onlyStarred:"Starred only",browseCount:(shown,total,saved)=>`Showing: ${shown} / ${total} · starred: ${saved}`,startStarred:"Quiz from stars →",noMatches:"No questions match your search.",emptyStars:"You haven't starred any questions yet. Show the full bank and choose what to practise.",showAll:"Show all questions",headerStars:"Show starred questions",saveFailure:"Your browser could not save your progress. Keep this tab open; use Save a copy to keep your stars.",exportDone:"Saved a copy of the quiz with your stars and chosen language.",noBank:"The question bank could not be loaded."}
};
function t(key,...args){const value=messages[language][key];return typeof value==="function"?value(...args):value??key;}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=String(text);return node;}
function tintAnswer(node,good){Object.assign(node.style,{backgroundColor:good?"#123429":"#3b202b",borderColor:good?"#62dfa7":"#ff8d9b",color:good?"#c4f7dc":"#ffd4dc"});}
function button(text,className,action){const b=el("button","btn "+(className||""),text);b.type="button";if(action)b.addEventListener("click",action);return b;}
function p(text,className){return el("p",className,text);}
function top(){window.scrollTo({top:0,behavior:"auto"});}
function toast(text){$("toast").textContent=text;$("toast").classList.remove("hidden");clearTimeout(toastTimer);toastTimer=setTimeout(()=>$("toast").classList.add("hidden"),5500);}
function readStorage(key){try{return JSON.parse(localStorage.getItem(key)||"null");}catch{return null;}}
function core(items){return items.map(q=>({id:q.id,prompt:q.number===28?q.prompt.split("\n\n")[0]:q.prompt,type:q.type,options:q.options,correct:q.correct,pairs:q.pairs?.map(pair=>({left:pair.left,right:q.number===10?(oldCategories[pair.right]||pair.right):pair.right})),choices:q.choices?.map(c=>q.number===10?(oldCategories[c]||c):c),answer:q.answer}));}
function hash(text){let h=2166136261;for(let i=0;i<text.length;i++)h=Math.imul(h^text.charCodeAt(i),16777619);return(h>>>0).toString(16);}
const fingerprint=hash(JSON.stringify(core(bank)));
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify({schema:2,bankFingerprint:fingerprint,language,selectedScope,favorites:[...favorites],session,history:history.slice(-10)}));}catch{if(!persistenceWarning){persistenceWarning=true;toast(t("saveFailure"));}}}
function randomInt(max){if(window.crypto?.getRandomValues){const a=new Uint32Array(1),limit=Math.floor(4294967296/max)*max;do{window.crypto.getRandomValues(a);}while(a[0]>=limit);return a[0]%max;}return Math.floor(Math.random()*max);}
function shuffle(values){const a=values.slice();for(let i=a.length-1;i>0;i--){const j=randomInt(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}
function same(a,b){return JSON.stringify(a)===JSON.stringify(b);}
function qText(q){return language==="pl"?q.pl?.prompt||q.prompt:q.prompt;}
function optionText(q,id){const index=q.options.findIndex(o=>o.id===id);return language==="pl"?q.pl?.options?.[index]??q.options[index]?.text:q.options[index]?.text;}
function choiceText(q,value){const index=q.choices.indexOf(value);return language==="pl"?q.pl?.choices?.[index]??value:value;}
function pairText(q,index){return language==="pl"?q.pl?.pairs?.[index]?.left??q.pairs[index].left:q.pairs[index].left;}
function explanationText(q){return language==="pl"?q.pl?.explanation??q.explanation:q.explanation;}
function scopeName(scope){return t(scope==="starred"?"starredScope":"allScope");}
function pool(scope){return scope==="starred"?bank.filter(q=>favorites.has(q.id)):bank;}
function answeredCount(){return session?session.order.filter(id=>has(session.answers,id)).length:0;}
function current(){return session?byId.get(session.order[session.index]):null;}
function readyToCheck(q,value){return q.type==="multiple"?Array.isArray(value)&&value.length>0:complete(q,value);}
function complete(q,value){if(q.type==="single")return Array.isArray(value)&&value.length===1;if(q.type==="multiple")return Array.isArray(value)&&value.length===q.correct.length;if(q.type==="match")return Array.isArray(value)&&value.length===q.pairs.length&&value.every(Boolean);return typeof value==="string"&&!!value.trim();}
function normalAnswer(value){let s=String(value||"").toLowerCase().replace(/[\s\u200b-\u200d\ufeff]/g,"").replace(/\.$/,"");return /^\/?\d+$/.test(s)?s.replace(/^\//,""):s;}
function isCorrect(q,value){if(!complete(q,value))return false;if(q.type==="text")return normalAnswer(value)===normalAnswer(q.answer);if(q.type==="match")return q.pairs.every((pair,i)=>pair.right===value[i]);return same([...value].sort(),[...q.correct].sort());}
function score(){return session?session.order.reduce((n,id)=>n+Number(isCorrect(byId.get(id),session.answers[id])),0):0;}
function correctText(q){if(q.type==="text")return q.answer;if(q.type==="match")return q.pairs.map((pair,i)=>pairText(q,i)+" → "+choiceText(q,pair.right)).join("\n");return q.correct.map(id=>optionText(q,id)).join("\n");}
function correctHint(text,id){const hint=p(text,"correct-hint");hint.id=id;hint.style.color="#62dfa7";hint.setAttribute("role","status");return hint;}
function answerText(q,value){if(q.type==="text")return value||t("noAnswer");if(q.type==="match")return q.pairs.map((pair,i)=>pairText(q,i)+" → "+(value?.[i]?choiceText(q,value[i]):t("noAnswer"))).join("\n");return q.options.filter(o=>value?.includes(o.id)).map(o=>optionText(q,o.id)).join("\n")||t("noAnswer");}
function updateHeader(){document.documentElement.lang=language;document.title="IP / quiz — CCNA 11–13";$("language-group").setAttribute("aria-label",t("language"));$("lang-pl").setAttribute("aria-pressed",String(language==="pl"));$("lang-en").setAttribute("aria-pressed",String(language==="en"));$("header-stars").textContent="★ "+favorites.size;$("header-stars").title=t("headerStars");$("header-stars").setAttribute("aria-label",t("headerStars")+": "+favorites.size);$("footer-note").textContent=t("footer");$("source-note").textContent=t("source");}
function updateStarButton(b){const saved=favorites.has(b.dataset.starId);b.setAttribute("aria-pressed",String(saved));b.setAttribute("aria-label",t(saved?"removeStar":"addStar")+" · "+t("question")+" "+byId.get(b.dataset.starId).number);b.title=t(saved?"removeStar":"addStar");b.replaceChildren(el("span","star-glyph",saved?"★":"☆"));if(b.dataset.compact!=="true")b.append(el("span","star-label",t(saved?"starred":"addStar")));}
function starButton(q,compact=false){const b=el("button","star-button");b.type="button";b.dataset.starId=q.id;b.dataset.compact=String(compact);updateStarButton(b);b.addEventListener("click",()=>toggleFavorite(q.id));return b;}
function toggleFavorite(id){if(!byId.has(id))return;if(favorites.has(id))favorites.delete(id);else favorites.add(id);persist();updateHeader();document.querySelectorAll("[data-star-id]").forEach(updateStarButton);if(view==="browse"&&refreshBrowse)refreshBrowse();}
function setLanguage(next){if(!["pl","en"].includes(next)||next===language)return;language=next;persist();updateHeader();if(view==="quiz")renderQuestion();else if(view==="results")results();else if(view==="browse")browse();else home();}
function openBrowser(only=false){browseFavoritesOnly=only&&favorites.size>0;browseQuery="";browse();top();}
function start(scope=selectedScope){const questions=pool(scope);if(!questions.length)return toast(t("noStars"));const previous=session?.order||[];let order=shuffle(questions.map(q=>q.id));if(order.length>1&&same(order,previous))order.push(order.shift());selectedScope=scope;session={order,index:0,answers:{},drafts:{},optionOrders:{},scope,startedAt:Date.now(),finishedAt:null};for(const q of questions)session.optionOrders[q.id]=shuffle(q.type==="match"?q.choices:q.options.map(o=>o.id));reviewErrorsOnly=true;persist();renderQuestion();top();}

 if(session&&!session.finishedAt){const banner=el("section","card resume-banner"),text=el("div");text.append(el("div","eyebrow",t("resumeEyebrow")),p(t("resumeText",answeredCount(),session.order.length,scopeName(session.scope)),"small muted"));banner.append(text,button(t("resume"),"primary",()=>{renderQuestion();top();}));app.append(banner);}

            { data: "2026.10.28 środa", start: "13:15", end: "15:30", czas: "3h00m", wykladowca: "dr Zdzisław Pogoda", przedmiot: "Metody probabilistyczne i statystyka 30h", typ: "Wyk", grupy: "W/IS/s/2025S", sala: "E-learning", uwagi: "E-learning" },

            // 29 Października

            { data: "2026.10.29 czwartek", start: "16:25", end: "17:55", czas: "2h00m", wykladowca: "mgr inż. Jan Kozieński", przedmiot: "Zabezpieczenie działalności komputerowej* L2 30h", typ: "Lab", grupy: "L2/IS/s/2025S", sala: "WI WI 1.2", uwagi: "" },

        ];

        function getTypeStyles(typ) {
            switch(typ) {
                case 'Wyk': return 'bg-blue-100 text-blue-800 border-blue-200';
                case 'Lab': return 'bg-emerald-100 text-emerald-800 border-emerald-200';
                case 'Proj': return 'bg-purple-100 text-purple-800 border-purple-200';
                case 'Ca': return 'bg-orange-100 text-orange-800 border-orange-200';
                case 'Lek': return 'bg-yellow-100 text-yellow-800 border-yellow-200';
                default: return 'bg-slate-100 text-slate-800 border-slate-200';
            }
        }

        function getRoomStyles(sala) {
            if (!sala || sala.toLowerCase().includes('e-learning')) {
                return 'bg-pink-50 text-pink-700 border-pink-200 ring-1 ring-pink-500/20';
            }
            return 'bg-slate-100 text-slate-700 border-slate-200';
        }

        function getRoomText(sala) {
            if (!sala || sala.toLowerCase().includes('e-learning')) {
                return `<svg class="w-3.5 h-3.5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>E-learning`;
            }
            return `<svg class="w-3.5 h-3.5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>${sala}`;
        }

        function renderSchedule(dataArray) {
            const container = document.getElementById('scheduleContainer');
            const noResults = document.getElementById('noResults');
            
            container.innerHTML = '';
            
            if (dataArray.length === 0) {
                container.classList.add('hidden');
                noResults.classList.remove('hidden');
                return;
            } else {
                container.classList.remove('hidden');
                noResults.classList.add('hidden');
            }

            // Grupowanie zajęć po dacie
            const groupedData = dataArray.reduce((acc, item) => {
                if (!acc[item.data]) {
                    acc[item.data] = [];
                }
                acc[item.data].push(item);
                return acc;
            }, {});

            // Renderowanie HTML dla każdego dnia
            Object.keys(groupedData).forEach(date => {
                const dayClasses = groupedData[date];
                
                // Parsowanie części dnia (np. "2026.10.01", "czwartek")
                const [dateStr, dayName] = date.split(' ');
                
                const section = document.createElement('section');
                section.className = 'relative';

                // Nagłówek dnia z lepką pozycją
                const dateHeader = `
                    <div class="sticky top-[72px] z-20 bg-slate-50/95 backdrop-blur-sm py-3 mb-4 -mx-4 px-4 sm:mx-0 sm:px-0 flex items-baseline gap-3 border-b border-slate-200">
                        <h2 class="text-xl font-bold text-slate-900">${dateStr}</h2>
                        <span class="text-sm font-medium text-slate-500 capitalize">${dayName || ''}</span>
                    </div>
                `;

                // Karty zajęć dla danego dnia
                const cardsHTML = dayClasses.map(item => `
                    <article class="bg-white rounded-2xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow duration-200 overflow-hidden flex flex-col md:flex-row mb-4">
                        
                        <!-- Sekcja czasu i typu -->
                        <div class="bg-slate-50 md:w-48 shrink-0 flex flex-row md:flex-col justify-between items-center md:items-start p-4 border-b md:border-b-0 md:border-r border-slate-100">
                            <div>
                                <div class="text-lg font-bold text-slate-900">${item.start}</div>
                                <div class="text-sm text-slate-500 mb-1">${item.end} <span class="text-xs">(${item.czas})</span></div>
                            </div>
                            <span class="inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold border uppercase tracking-wide mt-0 md:mt-auto ${getTypeStyles(item.typ)}">
                                ${item.typ}
                            </span>
                        </div>

                        <!-- Sekcja detali -->
                        <div class="p-4 md:p-5 flex-grow flex flex-col justify-center">
                            <h3 class="text-base font-bold text-slate-900 leading-snug mb-1 pr-4">${item.przedmiot}</h3>
                            
                            <div class="flex items-center text-sm text-slate-600 mb-4">
                                <svg class="w-4 h-4 mr-1.5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                                </svg>
                                <span class="font-medium">${item.wykladowca}</span>
                            </div>

                            <div class="flex flex-wrap items-center gap-2 mt-auto">
                                <span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium border ${getRoomStyles(item.sala)}">
                                    ${getRoomText(item.sala)}
                                </span>
                                <span class="inline-flex items-center px-2 py-1 rounded-md text-xs font-medium bg-slate-100 text-slate-600 border border-slate-200">
                                    <svg class="w-3.5 h-3.5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                    </svg>
                                    ${item.grupy}
                                </span>
                            </div>
                        </div>

                    </article>
                `).join('');

                section.innerHTML = dateHeader + `<div>${cardsHTML}</div>`;
                container.appendChild(section);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Renderuj domyślnie całość
            renderSchedule(rawData);

            // Podłączenie eventu wyszukiwania
            const searchInput = document.getElementById('searchInput');
            
            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                
                if (term === '') {
                    renderSchedule(rawData);
                    return;
                }

                const filteredData = rawData.filter(item => {
                    return (
                        item.przedmiot.toLowerCase().includes(term) ||
                        item.wykladowca.toLowerCase().includes(term) ||
                        item.sala.toLowerCase().includes(term) ||
                        item.grupy.toLowerCase().includes(term) ||
                        item.typ.toLowerCase().includes(term)
                    );
                });

                renderSchedule(filteredData);
            });
        });
    </script>
</body>

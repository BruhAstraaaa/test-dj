 function review(){list.replaceChildren();let shown=0;session.order.forEach((id,i)=>{const q=byId.get(id),value=session.answers[id],good=isCorrect(q,value);if(reviewErrorsOnly&&good)return;shown++;const item=el("article","card review-card"+(good?" correct":"")),meta=el("div","review-meta");meta.append(el("span",null,t("reviewMeta",good,i+1,q.number)),starButton(q,true));item.append(meta,el("h3",null,qText(q)));const yours=el("div","review-answer");yours.append(el("span",null,t("yourAnswer")+":\n"),answerText(q,value));item.append(yours);if(!good){const right=el("div","review-answer right spacer");right.append(el("span",null,t("correctAnswer")+":\n"),correctText(q));item.append(right);}explanation(q,item);list.append(item);});if(!shown)list.append(p(t("noErrors"),"note"));}
 toggle.addEventListener("change",()=>{reviewErrorsOnly=toggle.checked;review();});review();
}
function browse(){view="browse";updateHeader();const app=$("app");app.replaceChildren();const hero=el("div","hero");hero.append(el("div","eyebrow",t("browseEyebrow")),el("h1",null,t("browseTitle")),p(t("browseText"),"muted"));app.append(hero);const toolbar=el("div","card browse-toolbar"),searchBox=el("div"),searchLabel=el("label","search-label",t("searchLabel"));searchLabel.htmlFor="search-questions";const search=el("input","search-input");search.id="search-questions";search.type="search";search.value=browseQuery;search.placeholder=t("searchPlaceholder");searchBox.append(searchLabel,search);toolbar.append(searchBox,button(t("back"),"quiet",()=>{home();top();}));app.append(toolbar);const info=el("div","browse-info"),count=p("","small muted"),label=el("label","switch-label"),filter=el("input");filter.type="checkbox";filter.id="filter-starred";filter.checked=browseFavoritesOnly;label.append(filter,t("onlyStarred"));info.append(count,label);app.append(info);const actions=el("div","actions"),startButton=button(t("startStarred"),"gold",()=>start("starred"));startButton.id="start-starred";actions.append(startButton);app.append(actions);const list=el("div");list.id="browse-list";app.append(list);
 refreshBrowse=()=>{list.replaceChildren();const term=browseQuery.trim().toLocaleLowerCase(language);const shown=bank.filter(q=>(!browseFavoritesOnly||favorites.has(q.id))&&(!term||(q.number+" "+qText(q)).toLocaleLowerCase(language).includes(term)));count.textContent=t("browseCount",shown.length,bank.length,favorites.size);startButton.disabled=!favorites.size;for(const q of shown){const row=el("article","browse-row");row.append(el("span","browse-number","#"+q.number),p(qText(q),"browse-question"),starButton(q,true));list.append(row);}if(!shown.length){const empty=el("div","empty-state");empty.append(p(t(browseFavoritesOnly&&!favorites.size?"emptyStars":"noMatches")));if(browseFavoritesOnly)empty.append(button(t("showAll"),"quiet",()=>{browseFavoritesOnly=false;filter.checked=false;browseQuery="";search.value="";refreshBrowse();}));list.append(empty);}};
 search.addEventListener("input",()=>{browseQuery=search.value;refreshBrowse();});filter.addEventListener("change",()=>{browseFavoritesOnly=filter.checked;refreshBrowse();});refreshBrowse();
}
function exportQuiz(){const clone=document.documentElement.cloneNode(true);clone.querySelector("#app").replaceChildren();const message=clone.querySelector("#toast");message.textContent="";message.classList.add("hidden");clone.querySelector("#quiz-data").textContent=JSON.stringify({version:2,bank,favorites:[...favorites],settings:{language,scope:selectedScope}}).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");const blob=new Blob(["<!doctype html>\n",clone.outerHTML],{type:"text/html;charset=utf-8"});const url=URL.createObjectURL(blob),a=el("a");a.href=url;a.download="quiz-ccna-14-15.html";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);toast(t("exportDone"));}
function restoreSession(candidate){if(!candidate||!Array.isArray(candidate.order)||!candidate.order.length||new Set(candidate.order).size!==candidate.order.length||candidate.order.some(id=>!byId.has(id))||!Number.isInteger(candidate.index)||candidate.index<0||candidate.index>candidate.order.length||!candidate.answers)return null;candidate.scope=candidate.scope==="starred"?"starred":"all";candidate.drafts=candidate.drafts||{};candidate.optionOrders=candidate.optionOrders||{};for(const id of candidate.order){const q=byId.get(id),options=q.type==="match"?q.choices:q.options.map(o=>o.id),saved=candidate.optionOrders[id];if(!Array.isArray(saved)||saved.length!==options.length||new Set(saved).size!==options.length||saved.some(v=>!options.includes(v)))candidate.optionOrders[id]=shuffle(options);}if(candidate.index===candidate.order.length&&!candidate.finishedAt)candidate.finishedAt=Date.now();candidate.startedAt=Number.isFinite(candidate.startedAt)?candidate.startedAt:Date.now();return candidate;}
function restore(){const saved=readStorage(STORAGE);if(saved?.schema===2){if(["pl","en"].includes(saved.language))language=saved.language;selectedScope=saved.selectedScope==="starred"?"starred":"all";favorites=new Set((Array.isArray(saved.favorites)?saved.favorites:[]).filter(id=>byId.has(id)));if(saved.bankFingerprint===fingerprint){session=restoreSession(saved.session);history=Array.isArray(saved.history)?saved.history:[];}}
 updateHeader();home();}

restore();
